 else{const a=(DEMO?DM:REAL)[k],i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;persist();applyData();refresh()}}
async function delDoc(k,id){if(!CAN){toast('Solo lectura');return}
 if(DB&&!DEMO){if(!FBU){toast('Inicia sesión primero');return}try{await DB.del(COLN[k],id)}catch(e){toast('No se pudo eliminar')}}
 else{const a=(DEMO?DM:REAL)[k],i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);persist();applyData();refresh()}}
let FBU=null,UNS=[];
async function initSync(){
 if(!window.CMFB&&!window.CMFB_ERR){await new Promise(r=>{window.addEventListener('cmfb',r,{once:true});setTimeout(r,9000)})}
 if(!window.CMFB){loadLocal();applyData();return setSync('local')}
 DB=window.CMFB;
 DB.onAuth(u=>{FBU=u;UNS.forEach(f=>{try{f()}catch(e){}});UNS=[];
  if(!u){REAL.E=[];REAL.trips=[];REAL.EX=[];applyData();return setSync('signedout')}
  const got=new Set();setSync('loading');
  for(const k of['E','trips','EX'])UNS.push(DB.listen(COLN[k],a=>{REAL[k]=a;got.add(k);applyData();if(got.size===3)setSync('ok');else refresh()},()=>setSync('err')))})}

 if(s==='form'){F.dm=F.dm||'dia';

  h=hdr('Nuevo viaje')+`<div class="fb"><div class="ticket form"><div class="tm"><small>✈ Billete de avión</small>${place}<div class="lbl">Fechas</div><div class="dates"><input type="date" id="d1" value="${F.d1||''}"><span>—</span><input type="date" id="d2" value="${F.d2||''}"></div></div><div class="stub"><i class="bar"></i></div></div><div class="err" id="err"></div><button class="save" data-a="next">SIGUIENTE →</button></div>`}

 if(s==='detail'){const e=F.e,t=e.trip&&trips.find(x=>x.id===e.trip);
  h=hdr('Detalle del gasto')+`<div class="fb"><div class="det">${[['Fecha',e.d?fd(e.d):'Solo mes · '+months[+e.m.slice(5)-1]],['Importe',fmt(e.amt)],['Categoría',e.cat],...(e.sup?[['Supermercado',e.sup]]:[]),[e.kind==='trip'?'Corresponde a':'Cuenta',e.kind==='trip'?e.to:e.acc],['Observaciones',e.obs||'—'],...(t?[['Viaje',t.place+' · '+rng(t)]]:[])].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div><button class="save" data-a="edit">Editar</button><button class="save del" data-a="del">Eliminar</button></div>`}
 if(s==='adj'){const b=bal(F.acc,F.y,F.mo)||{pre:0,aj:0,cl:0};
  h=hdr('⚖️ Ajustar saldo · '+F.acc)+`<div class="fb"><div class="lbl">Mes</div><p style="margin:4px 2px;font-size:18px;font-weight:700">${months[F.mo-1]} ${F.y}</p><div class="bal" style="margin:8px 0"><div class="r"><span>Saldo calculado por la app</span><b>${fmt(b.pre)}</b></div>${b.aj?`<div class="r"><span>Ajuste actual</span><b>${sg(b.aj)}</b></div>`:''}</div><div class="lbl">Saldo real en la cuenta *</div><div class="amt"><input id="real" inputmode="decimal" placeholder="0,00"><span>€</span></div><p class="hint">Mira el saldo en tu banco e indícalo. La app guarda la diferencia como ajuste de este mes y el nuevo saldo pasa al mes siguiente.</p><div class="err" id="err"></div><button class="save" data-a="adjsave">GUARDAR AJUSTE</button>${b.aj?`<button class="save del" data-a="adjdel" style="margin-top:10px">Quitar ajuste</button>`:''}</div>`}
 if(s==='extra')h=hdr('Ingreso extra · '+F.acc)+`<div class="fb"><div class="lbl">Mes</div><p style="margin:4px 2px;font-size:18px;font-weight:700">${months[F.mo-1]} ${F.y}</p>${amtBox}<div class="err" id="err"></div>${obsBox}<button class="save" data-a="save">GUARDAR</button></div>`;
 fw.innerHTML=h;fw.scrollTop=0;
 if(F.edit&&(s==='form'||s==='texp')){const e=F.edit;$('#imp').value=String(e.amt).replace('.',',');$('#obs').value=e.obs||'';if(s==='texp'){$('#tc').value=e.cat;$('#dt').value=e.d||''}}}

async function nextTrip(btn){F.d1=$('#d1').value;F.d2=$('#d2').value;
 if(F.man){F.mc=$('#mc').value.trim();F.mp=$('#mp').value.trim();F.mk=$('#mk').value.trim();
  if(!F.mc||!F.mp||!F.mk)return err('Rellena ciudad, provincia y país');const c=ctry(F.mk);if(!c)return err('Elige el país de la lista para poder poner su bandera');
  F.place=F.mc;F.prov=F.mp;F.iso=c.iso;F.country=c.name}
 if(!F.iso)return err('Elige un lugar de la lista o añádelo manualmente');if(!F.d1||!F.d2)return err('Indica las dos fechas');if(F.d2<F.d1)return err('La vuelta no puede ser antes de la ida');
 const t={id:uid(),place:F.place,prov:F.prov||'',iso:F.iso,country:F.country,from:F.d1,to:F.d2};
 if(F.man){btn.disabled=true;err('Buscando el lugar en el mapa…');const g=await geo(F.mc,F.mp,F.mk);btn.disabled=false;if(g){t.lat=g[0];t.lon=g[1]}}
 saveDoc('trips',t);F.trip=t;F.step='texp';draw()}
function openAdj(a,y,mo){F={step:'adj',acc:a,y,mo};$('#flow').classList.add('show');draw();const b=bal(a,y,mo);if(b&&b.aj)$('#real').value=String(Math.round(b.cl*100)/100).replace('.',',')}

function amount(){const v=parseFloat(($('#imp').value||'').replace(',','.'));if(!(v>0)){err('Introduce un importe mayor que 0');$('#imp').focus();return null}return v}
fw.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='back'){if(BACK[F.step]&&!F.edit){F.step=BACK[F.step];draw()}else closeFlow()}
 else if(a==='cat'){F.cat=b.dataset.n;F.sup='';F.dm='dia';F.d=null;F.step='form';draw()}
 else if(a==='sumtrip')openFlow('viajes',F.kind==='naranja'?'Naranja':'Revolut');
 else if(a==='dm'){const c=$('#dt');if(c)F.d=c.value;F.dm=b.dataset.m;fw.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));$('#dw').innerHTML=dwrap()}
 else if(a==='newtrip'){F.place='';F.iso=null;F.d1=F.d2='';F.man=false;F.mc=F.mp=F.mk='';F.prov='';F.lat=F.lon=null;F.step='newtrip';draw()}

 else if(a==='lista'){F.d1=$('#d1').value;F.d2=$('#d2').value;F.man=false;F.place='';F.iso=null;F.prov='';draw()}
 else if(a==='pick'){F.trip=trips.find(t=>t.id==b.dataset.id);F.step='texp';draw()}
 else if(a==='sel'){const p=P[b.dataset.i];F.place=p[0];F.iso=p[1];F.country=p[2];F.prov=p[4]||'';$('#lug').value=p[0];$('#sug').innerHTML='';err('');setBg(p[1])}
 else if(a==='next')nextTrip(b)
 else if(a==='edit'){const e=F.e;F=e.kind==='trip'?{kind:'viajes',trip:trips.find(t=>t.id===e.trip),step:'texp',who:e.to,edit:e}:{kind:e.acc.toLowerCase(),cat:e.cat,sup:e.sup||'',step:'form',edit:e,dm:e.d?'dia':'mes',d:e.d||e.m+'-01'};draw()}
 else if(a==='del'){if(!F.conf){F.conf=1;b.textContent='Pulsa otra vez para eliminar';return}delDoc('E',F.e.id);toast('Gasto eliminado');closeFlow()}

 else if(a==='who'){F.who=b.dataset.n;fw.querySelectorAll('.who button').forEach(x=>x.classList.toggle('on',x===b))}
 else if(a==='adjsave'){const v=parseFloat(($('#real').value||'').replace(',','.'));if(isNaN(v))return err('Introduce el saldo real (puede ser 0)');const b=bal(F.acc,F.y,F.mo),aj=Math.round((v-b.pre)*100)/100,id='adj-'+F.acc+'-'+K(F.y,F.mo);
  if(Math.abs(aj)<.005){if(EX.some(x=>x.id===id))delDoc('EX',id)}else saveDoc('EX',{id,acc:F.acc,m:K(F.y,F.mo),amt:aj,obs:'Ajuste manual',adj:true});toast('Saldo ajustado ✓');closeFlow()}
 else if(a==='adjdel'){delDoc('EX','adj-'+F.acc+'-'+K(F.y,F.mo));toast('Ajuste quitado');closeFlow()}
 else if(a==='save'){const amt=amount();if(amt==null)return;const obs=$('#obs').value,cur=iso(new Date()).slice(0,7);let o;
  if(F.step==='extra'){saveDoc('EX',{id:uid(),acc:F.acc,m:K(F.y,F.mo),amt,obs});toast('Ingreso extra añadido ✓');closeFlow();return}

   o={kind:'casa',acc:F.kind==='naranja'?'Naranja':'Revolut',cat:F.cat,amt,d,m,obs};if(F.kind==='revolut'&&F.cat==='Alimentación')o.sup=F.sup||'';toast(F.edit?'Cambios guardados ✓':'Gasto guardado ✓')}

function csvRows(txt){txt=txt.replace(/^﻿/,'').replace(/\r\n?/g,'\n');const l0=txt.split('\n')[0]||'';
 const nc=(l0.match(/;/g)||[]).length,nm=(l0.match(/,/g)||[]).length,d=l0.includes('\t')?'\t':(nc>0&&nc>=nm?';':',');
 const rows=[];let r=[],c='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 r.push(c);rows.push(r);return rows.map(x=>x.map(s=>s.trim()))}
const okd=(y,mo,d)=>{const t=new Date(y,mo-1,d);return y>=2000&&y<=2100&&t.getFullYear()===y&&t.getMonth()===mo-1&&t.getDate()===d?{d:`${y}-${pad(mo)}-${pad(d)}`,m:`${y}-${pad(mo)}`}:null};
const okm=(y,mo)=>mo>=1&&mo<=12&&y>=2000&&y<=2100?{d:null,m:`${y}-${pad(mo)}`}:null;
function pdate(s){let m;s=(s||'').trim();
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return okd(+m[1],+m[2],+m[3]);
 if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){let y=+m[3];if(y<100)y+=2000;return okd(y,+m[2],+m[1])}
 if(m=s.match(/^(\d{4})-(\d{1,2})$/))return okm(+m[1],+m[2]);
 if(m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/))return okm(+m[2],+m[1]);return null}
function pamt(s){s=(s||'').replace(/[€\s]/g,'');if(!s)return NaN;
 if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 return /^\d+(\.\d+)?$/.test(s)?Math.round(parseFloat(s)*100)/100:NaN}
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)}
const HK={fecha:['fecha','dia','date'],cuenta:['cuenta','asignacion','cuentaasignacion','correspondea','pagadocon','pagado'],cat:['categoria','categorias','tipo'],imp:['importe','cantidad','total','euros','precio'],obs:['observaciones','observacion','notas','nota','concepto','comentario','descripcion'],sup:['supermercado','super','tienda'],viaje:['viaje','destino'],ida:['ida','inicio','desde','fechaida'],vuelta:['vuelta','fin','hasta','fechavuelta']};
function parseImport(txt){const all=csvRows(txt),res={items:[],errs:[],nCasa:0,nViaje:0,nTrips:0,total:0};
 let hi=all.findIndex(r=>r.some(x=>x));if(hi<0){res.errs.push([1,'No hay datos']);return res}
 const col={};all[hi].forEach((x,i)=>{const k=norm(x).replace(/[^a-z]/g,'');for(const f in HK)if(HK[f].includes(k)&&col[f]===undefined)col[f]=i});
 for(const f of['fecha','cuenta','cat','imp'])if(col[f]===undefined){res.errs.push([hi+1,'Falta la columna '+({fecha:'Fecha',cuenta:'Cuenta',cat:'Categoría',imp:'Importe'}[f])+' en la cabecera']);return res}
 const g=(r,f)=>col[f]===undefined?'':(r[col[f]]||''),nw={},occ={},exp=[],ACC=['Naranja','Revolut','Alba','David'];
 for(let i=hi+1;i<all.length;i++){const r=all[i];if(!r.some(x=>x))continue;const n=i+1;
  const fe=pdate(g(r,'fecha'));if(!fe){res.errs.push([n,'Fecha no válida: «'+g(r,'fecha')+'»']);continue}
  const am=pamt(g(r,'imp'));if(!(am>0)){res.errs.push([n,'Importe no válido: «'+g(r,'imp')+'»']);continue}
  const cu=ACC.find(a=>norm(a)===norm(g(r,'cuenta')));if(!cu){res.errs.push([n,'Cuenta no válida: «'+g(r,'cuenta')+'» (usa Naranja, Revolut, Alba o David)']);continue}
  const obs0=g(r,'obs'),obs=obs0,via=g(r,'viaje'),cn=norm(g(r,'cat')).replace(/[^a-z ]/g,'').trim();
  if(!via){
   if(cu==='Alba'||cu==='David'){res.errs.push([n,cu+' solo se usa en gastos de viaje: rellena la columna Viaje']);continue}
   const L=CATS[cu.toLowerCase()];let c=L.find(x=>norm(x[1])===cn),obs=obs0;if(!c){c=L[L.length-1];obs=(obs0?obs0+' · ':'')+'['+(g(r,'cat')||'sin categoría')+']'}
   const sig=JSON.stringify(['c',cu,c[1],am,fe.d||fe.m,obs]);occ[sig]=(occ[sig]||0)+1;
   const o2={id:'i'+h53(sig+'#'+occ[sig]),kind:'casa',acc:cu,cat:c[1],amt:am,d:fe.d,m:fe.m,obs};
   if(cu==='Revolut'&&c[1]==='Alimentación'){const sp=SUPS.find(x=>norm(g(r,'sup')).includes(norm(x))||norm(obs0).includes(norm(x)));if(sp)o2.sup=sp}
   exp.push(o2);res.nCasa++}
  else{
   let tc=TC.find(x=>norm(x[1])===cn),obs=obs0;if(!tc){tc=TC[TC.length-1];obs=(obs0?obs0+' · ':'')+'['+(g(r,'cat')||'sin categoría')+']'}
   const pn=norm(via),pl=P.find(p=>norm(p[0])===pn),ex=trips.filter(t=>norm(t.place)===pn);
   if(!pl&&!ex.length){res.errs.push([n,'Lugar «'+via+'» no reconocido (usa una ciudad, provincia o país de la lista, p. ej. Lisboa)']);continue}
   const ida=g(r,'ida')?pdate(g(r,'ida')):null,vue=g(r,'vuelta')?pdate(g(r,'vuelta')):null;
   if((g(r,'ida')&&!(ida&&ida.d))||(g(r,'vuelta')&&!(vue&&vue.d))){res.errs.push([n,'Fechas de ida/vuelta no válidas']);continue}
   let tid=null;
   if(ida&&vue){const e1=ex.find(t=>t.from===ida.d&&t.to===vue.d);if(e1)tid=e1.id;else{const k=pn+'|'+ida.d+'|'+vue.d;tid='it'+h53(k);nw[tid]=nw[tid]||{id:tid,place:pl[0],iso:pl[1],prov:pl[4]||'',country:pl[2],from:ida.d,to:vue.d,ds:[]}}}
   else{const e1=fe.d&&ex.find(t=>t.from<=fe.d&&fe.d<=t.to);if(e1)tid=e1.id;else{if(!pl){res.errs.push([n,'Ese gasto no cae en las fechas de ningún viaje existente a «'+via+'»: indica Ida y Vuelta']);continue}tid='it'+h53(pn+'|');nw[tid]=nw[tid]||{id:tid,place:pl[0],iso:pl[1],prov:pl[4]||'',country:pl[2],from:null,to:null,ds:[]}}}
   if(nw[tid])nw[tid].ds.push(fe.d||fe.m+'-01');
   const cat=tc[0]+' '+tc[1],sig=JSON.stringify(['v',tid,cu,cat,am,fe.d||fe.m,obs]);occ[sig]=(occ[sig]||0)+1;
   exp.push({id:'i'+h53(sig+'#'+occ[sig]),kind:'trip',trip:tid,cat,to:cu,amt:am,d:fe.d,m:fe.m,obs});res.nViaje++}
  res.total+=am}
 for(const t of Object.values(nw)){if(!t.from){const s=[...t.ds].sort();t.from=s[0];t.to=s[s.length-1]}delete t.ds;res.items.push(['trips',t]);res.nTrips++}
 exp.forEach(e=>res.items.push(['expenses',e]));return res}
