 const segs=it.map((i,k)=>{if(!(i.v>0))return '';const L=i.v/t*C,x=`<circle data-seg="${k}" cx="80" cy="80" r="${R}" fill="none" stroke="${i.c}" stroke-width="26" stroke-dasharray="${Math.max(0,L-1.5)} ${C}" stroke-dashoffset="${-a}" transform="rotate(-90 80 80)"/>`;a+=L;return x}).join('');
 return `<div class="dg" data-t="${fmt0(t)}"><div class="dn"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="62" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-width="26"/>${segs}<text class="c1" x="80" y="76" text-anchor="middle" font-size="8" fill="currentColor" opacity=".75"></text><text class="c2" x="80" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${fmt0(t)}</text></svg></div>`+
 it.map((i,k)=>`<button class="lg" data-ri="${k}" ${i.attr||''}><i style="background:${i.c}"></i><span>${i.n}${i.sh?`<small style="display:block;opacity:.6;font-weight:500">${i.sh}</small>`:''}</span><b>${fmt(i.v)}</b>${i.b!==undefined?i.b:`<small>${t?Math.round(i.v/t*100):0}%</small>`}</button>`).join('')+`</div>`}
function segSel(c){const g=c.closest('.dg'),k=c.dataset.seg,was=g.dataset.sel===k;g.dataset.sel=was?'':k;

const sum2=a=>a.reduce((s,i)=>s+i.v,0);
const row=e=>`<button class="ex" data-ex="${e.id}"><span class="dt">${e.d?fd(e.d).slice(0,5):ml[+e.m.slice(5)-1]}</span><span class="ec">${e.kind==='trip'?'✈️ '+trips.find(t=>t.id===e.trip).place+' · '+e.cat.replace(/^\S+\s/,'')+' · '+e.to:e.cat}</span><b>${fmt(e.amt)}</b></button>`;

const badge=(cur,base)=>{if(!(base>0))return '<small class="bd" style="opacity:.5">—</small>';const d=Math.round((cur/base-1)*100);return `<small class="bd" style="color:${d>0?'#E5484D':'#2E9E5B'}">${d>0?'+':''}${d}%</small>`};

function accDash(a,y,emb){const col=a==='Naranja'?COL.N:COL.R,tot=accT(a,y),ms=Array.from({length:12},(_,i)=>accT(a,y,i+1)),mx=Math.max(...ms),n=el(y),cs=cats(a,y),ct=sum2(cs);
 const inc=INC[a]*n+sum(exs(a,y)),all=[...past,[NY,NM]],vals=all.map(([yy,m])=>accT(a,yy,m)),av=hAvg(a),hv=past.map(([yy,m])=>accT(a,yy,m)),lb=([yy,m])=>ml[m-1]+' '+String(yy).slice(2),imx=hv.indexOf(Math.max(...hv)),imn=hv.indexOf(Math.min(...hv));
 return `<h1>${a==='Naranja'?'🟠':'⚫'} Gastos ${a}</h1>`+(emb?`<div class="yl">${y}</div>`:ys(y))+

 let hi=all.findIndex(r=>r.some(x=>x));if(hi<0){res.errs.push([1,'No hay datos']);return res}
